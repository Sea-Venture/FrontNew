name: seaventures-frontend-dev
version: '3.8'
services:
  frontend:
    build:
      context: ..
      dockerfile: ./docker/files/dev.dockerfile
    container_name: frontend_dev
    ports:
      - "3000:3000"
    env_file:
      - ./envs/.env.dev
    volumes:
      - "${PWD}/..:/app" 
      - node_modules:/app/node_modules
    command: npm run dev -- --host
    networks:
      - app-network
volumes:
  node_modules:

networks:
  app-network:
    driver: bridge

